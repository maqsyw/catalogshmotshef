<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>одежда у шефа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0b0c;
      --card-bg: #141416;
      --accent-color: #f3f3f3;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Тоаст-уведомление-подсказка */
    .toast-banner {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background-color: #1f1f23;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      animation: fadeInOut 0.3s ease;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border-color: var(--accent-color);
    }

    .search-bar {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .filters-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filter-select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 600px) {
      .catalog-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: #1a1a1c;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-size {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .like-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
    }

    .like-btn.liked {
      color: #ff453a;
    }

    .product-details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .product-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .post-link {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      transition: opacity 0.2s;
    }

    .product-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .action-btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .action-btn.in-cart {
      background-color: var(--accent-color);
      color: #0b0b0c;
    }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background-color: #1f1f23;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 20px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    .cart-bar.visible {
      display: flex;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .cart-total {
      font-size: 1rem;
      font-weight: 700;
    }

    .cart-action-text {
      background-color: var(--accent-color);
      color: #0b0b0c;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.8);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background-color: #141416;
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-height: 40vh;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1c;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .remove-item {
      background: none;
      border: none;
      color: #ff453a;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background-color: #34c759;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- Всплывающая подсказка-инструкция -->
  <div id="toastBanner" class="toast-banner">👆 Пост открыт выше. Каталог свернут вниз.</div>

  <header>
    <h1>одежда у шефа</h1>
    <p>Selected Archive</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tabCatalog" onclick="switchTab('catalog')">Каталог</button>
    <button class="tab-btn" id="tabFavorites" onclick="switchTab('favorites')">Избранное (<span id="favCount">0</span>)</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по бренду, вещи..." oninput="filterProducts()" />
  </div>

  <div class="filters-section">
    <div class="filter-group">
      <select id="categoryFilter" class="filter-select" onchange="filterProducts()">
        <option value="all">Все категории</option>
      </select>
    </div>
    <div class="filter-group">
      <select id="sizeFilter" class="filter-select" onchange="filterProducts()">
        <option value="all">Все размеры</option>
      </select>
    </div>
  </div>

  <div id="catalog" class="catalog-grid">
    <div class="empty-state">Загрузка каталога...</div>
  </div>

  <div id="cartBar" class="cart-bar" onclick="openCartModal()">
    <div class="cart-info">
      <span class="cart-count" id="cartCountText">0 товаров</span>
      <span class="cart-total" id="cartTotalPrice">0 ЛЕЙ</span>
    </div>
    <div class="cart-action-text">Корзина</div>
  </div>

  <div id="cartModal" class="modal-overlay" onclick="closeCartModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">Ваш выбор</div>
        <button class="modal-close" onclick="closeCartModalDirect()">&times;</button>
      </div>
      <div id="cartItemsList" class="cart-items-list"></div>
      <button class="checkout-btn" onclick="sendOrderToManager()">Оформить заказ</button>
    </div>
  </div>
